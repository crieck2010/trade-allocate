[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-allocate"
version = "0.2.0"
description = "Strategy allocator: allocate capital across validated strategies by co-movement — risk parity, HRP, equal weight"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "portfolio", "allocation", "risk-parity", "quantitative-finance", "algorithmic-trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-allocate = "trade_allocate.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-allocate"
Repository = "https://github.com/crieck2010/trade-allocate"
"Bug Tracker" = "https://github.com/crieck2010/trade-allocate/issues"

[tool.setuptools.packages.find]
where = ["src"]
